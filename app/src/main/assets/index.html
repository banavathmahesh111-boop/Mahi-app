<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAHI</title>
<style>
:root{--r:#ff2437;--b:#2fa8ff;--bg:#050002}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{height:100dvh;display:flex;flex-direction:column;overflow-y:auto;color:#fff;font-family:Roboto,system-ui,sans-serif;background:radial-gradient(ellipse at 50% 28%,#32040b 0,#050002 68%);padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
body>*{flex-shrink:0}
button{font:inherit;color:inherit;background:none;border:0}
.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
header{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding-top:10px}
.sq{width:44px;height:44px;border:1.5px solid var(--r);border-radius:10px;color:var(--r);font-size:24px;display:grid;place-items:center;box-shadow:0 0 10px rgba(255,36,55,.55),inset 0 0 8px rgba(255,36,55,.25)}
.brand{text-align:center}
.t{font:italic 900 40px/1 Roboto,system-ui,sans-serif;letter-spacing:2px;color:var(--r);text-shadow:0 0 14px var(--r),0 0 28px rgba(255,36,55,.6)}
.s{font-weight:700;font-size:13px;letter-spacing:6px;margin-top:2px}
.g{display:flex;justify-content:center;align-items:center;gap:8px;font-style:italic;font-size:13px;color:#ffd9dc}
.g:before,.g:after{content:"";width:34px;height:1px;background:var(--r);box-shadow:0 0 6px var(--r)}
.hero{position:relative;flex:1 0 auto;min-height:270px;display:flex;justify-content:center;align-items:center}
.hero img{height:100%;max-height:340px;max-width:88%;object-fit:contain;mix-blend-mode:screen;-webkit-mask-image:radial-gradient(closest-side,#000 68%,transparent 100%);mask-image:radial-gradient(closest-side,#000 68%,transparent 100%)}
.pn{position:absolute;border:1.5px solid var(--r);border-radius:10px;background:rgba(20,3,8,.82);box-shadow:0 0 12px rgba(255,36,55,.5),inset 0 0 10px rgba(255,36,55,.2)}
.pl{left:0;top:2%;width:29%;padding:4px 7px}
.pl button{display:flex;align-items:center;gap:6px;width:100%;height:26px;font-size:10.5px;white-space:nowrap;text-align:left}
.pl .i{color:var(--r);font-size:16px;flex:none}
.pr{right:0;top:4%;width:30%;padding:8px}
.st{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;letter-spacing:.5px}
.dot{width:10px;height:10px;border-radius:50%;background:#27e04a;box-shadow:0 0 8px #27e04a}
body:not([data-state=idle]) .dot{background:var(--r);box-shadow:0 0 8px var(--r)}
.sm{font-size:10.5px;margin:6px 0 4px;color:#f2dede}
.eq{display:flex;align-items:center;gap:2px;height:24px}
.eq i,.w i{flex:1;max-width:3px;min-width:1px;height:var(--h);background:var(--r);border-radius:2px;box-shadow:0 0 4px var(--r)}
body:not([data-state=idle]) .eq i,body:not([data-state=idle]) .w i{animation:b .7s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes b{to{transform:scaleY(.3)}}
.voice{display:flex;align-items:center;height:112px;padding:0 10px;border:1.5px solid rgba(255,36,55,.6);border-radius:20px;background:linear-gradient(#14040b,#070104);box-shadow:0 0 14px rgba(255,36,55,.3)}
.w{flex:1;display:flex;align-items:center;justify-content:space-between;height:70px;gap:2px}
.mic{position:relative;width:92px;height:92px;margin:0 8px;border-radius:50%;border:3px solid var(--r);background:radial-gradient(#1c1c20,#050507);display:grid;place-items:center;font-size:38px;box-shadow:0 0 18px var(--r),inset 0 0 14px rgba(255,36,55,.55)}
.mic:before{content:"";position:absolute;inset:-10px;border:2px solid rgba(255,36,55,.7);border-radius:50%;border-top-color:transparent;border-bottom-color:transparent}
body[data-state=listening] .mic:before{animation:sp 2s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.tap{text-align:center;margin-top:6px;font-weight:700;font-size:16px;line-height:1.15}
.tap small{display:block;font-weight:400;font-size:12.5px}
.tap em{color:var(--r);font-weight:700}
.row{display:grid;grid-template-columns:1fr 104px 1fr;gap:8px;margin-top:10px}
.cd{border:1.5px solid var(--r);border-radius:14px;padding:8px 10px;background:linear-gradient(160deg,#1c050b,#080204);box-shadow:0 0 10px rgba(255,36,55,.35)}
.cd h3{display:flex;align-items:center;gap:6px;color:var(--r);font-size:14px;margin-bottom:6px}
.cd h3 .i{font-size:20px;flex:none}
.cd p{font-size:11px;line-height:1.25;margin-bottom:7px}
.fb{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:30px;border:1.5px solid var(--r);border-radius:8px;font-size:12px;background:rgba(255,36,55,.1)}
.qa button{display:flex;align-items:center;gap:7px;width:100%;height:26px;font-size:12px;white-space:nowrap}
.qa .i{font-size:18px;flex:none}
.clk{align-self:center;width:104px;height:104px;border-radius:50%;border:3px solid var(--r);background:#050205;display:grid;place-content:center;text-align:center;box-shadow:0 0 16px var(--r),inset 0 0 14px rgba(255,36,55,.5)}
.clk b{font-size:23px}
.clk span{font-size:10px}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 8px}
.nv{height:58px;border-radius:12px;border:1.5px solid #2a7fc0;background:#060b14;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#fff;box-shadow:0 0 8px rgba(47,168,255,.35)}
.nv .i{font-size:22px;color:#cfd6e0}
.nv.on{border-color:var(--r);background:#1a0408;box-shadow:0 0 10px var(--r)}
.nv.on .i{color:var(--r)}
</style>
</head>
<body data-state="idle">
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
<symbol id="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7.5" stroke-dasharray="3.2 2.2" stroke-width="3"/></symbol>
<symbol id="cap" viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5zM6 11.5V16c3 2.5 9 2.5 12 0v-4.5"/></symbol>
<symbol id="brain" viewBox="0 0 24 24"><path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 3 3 3 0 0 0 1.5 5A3 3 0 0 0 9 20zM15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 3 3 3 0 0 1-1.5 5A3 3 0 0 1 15 20z"/></symbol>
<symbol id="chip" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></symbol>
<symbol id="mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></symbol>
<symbol id="tgt" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.6"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></symbol>
<symbol id="play" viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></symbol>
<symbol id="bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></symbol>
<symbol id="yt" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4" fill="#ff2437" stroke="none"/><path d="M10 9l5 3-5 3z" fill="#fff" stroke="none"/></symbol>
<symbol id="ps" viewBox="0 0 24 24"><path d="M5 3l15 9-15 9z" fill="#aeb6c2" stroke="none"/></symbol>
<symbol id="cam" viewBox="0 0 24 24"><path d="M3 8h4l2-3h6l2 3h4v12H3z" fill="#ff2437" stroke="none"/><circle cx="12" cy="13.5" r="3.5" fill="#050002" stroke="none"/></symbol>
<symbol id="home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/></symbol>
<symbol id="stats" viewBox="0 0 24 24"><path d="M5 20v-9M12 20V4M19 20v-7" stroke-width="3"/></symbol>
<symbol id="hist" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></symbol>
</defs></svg>

<header>
  <button class="sq" data-a="menu"><svg class="i"><use href="#menu"/></svg></button>
  <div class="brand"><div class="t">MAHI</div><div class="s">AI ASSISTANT</div><div class="g">Always With You</div></div>
  <button class="sq" data-a="settings"><svg class="i"><use href="#gear"/></svg></button>
</header>

<section class="hero">
  <img src="hero.png" alt="MAHI">
  <div class="pn pl">
    <button data-a="study"><svg class="i"><use href="#cap"/></svg>Study Mode</button>
    <button data-a="assistant"><svg class="i"><use href="#brain"/></svg>Smart Assistant</button>
    <button data-a="tools"><svg class="i"><use href="#chip"/></svg>AI Tools</button>
    <button data-a="voice"><svg class="i"><use href="#mic"/></svg>Voice Control</button>
  </div>
  <div class="pn pr">
    <div class="st"><span class="dot"></span><span id="sl">READY</span></div>
    <div class="sm" id="sm">Waiting for you…</div>
    <div class="eq" id="eq"></div>
  </div>
</section>

<section class="voice">
  <div class="w" id="wl"></div>
  <button class="mic" id="mic" data-a="mic"><svg class="i"><use href="#mic"/></svg></button>
  <div class="w" id="wr"></div>
</section>
<div class="tap">Tap to Speak<small>or say <em>“Hey MAHI”</em></small></div>

<section class="row">
  <div class="cd">
    <h3><svg class="i"><use href="#tgt"/></svg>Focus Mode</h3>
    <p>Block Distractions • Boost Focus</p>
    <button class="fb" data-a="focus"><svg class="i"><use href="#play"/></svg>Start Focus</button>
  </div>
  <div class="clk"><b id="time">00:00</b><span id="date"></span></div>
  <div class="cd qa">
    <h3><svg class="i"><use href="#bolt"/></svg>Quick Actions</h3>
    <button data-a="youtube"><svg class="i"><use href="#yt"/></svg>Open YouTube</button>
    <button data-a="playstore"><svg class="i"><use href="#ps"/></svg>Open Play Store</button>
    <button data-a="screenshot"><svg class="i"><use href="#cam"/></svg>Take Screenshot</button>
  </div>
</section>

<nav>
  <button class="nv on" data-nav="home"><svg class="i"><use href="#home"/></svg>Home</button>
  <button class="nv" data-nav="stats"><svg class="i"><use href="#stats"/></svg>Stats</button>
  <button class="nv" data-nav="models"><svg class="i"><use href="#chip"/></svg>AI Models</button>
  <button class="nv" data-nav="history"><svg class="i"><use href="#hist"/></svg>History</button>
</nav>

<script>
const $=s=>document.querySelector(s);
const L={idle:['READY','Waiting for you…'],listening:['LISTENING','Listening…'],thinking:['THINKING','Thinking…'],speaking:['SPEAKING','Speaking…']};
function setState(s){if(!L[s])return;document.body.dataset.state=s;$('#sl').textContent=L[s][0];$('#sm').textContent=L[s][1]}
function bars(el,n,max){for(let k=0;k<n;k++){const i=document.createElement('i');const e=Math.sin(Math.PI*(k+.5)/n);i.style.setProperty('--h',(4+Math.random()*max*(.35+.65*e)).toFixed(0)+'px');i.style.setProperty('--d',(Math.random()*.7).toFixed(2)+'s');el.appendChild(i)}}
bars($('#wl'),28,64);bars($('#wr'),28,64);bars($('#eq'),16,24);
function act(n){const a=window.Android;if(a&&typeof a.onAction==='function')a.onAction(n)}
document.addEventListener('click',e=>{
  const n=e.target.closest('[data-nav]');
  if(n){document.querySelectorAll('.nv').forEach(x=>x.classList.toggle('on',x===n));act(n.dataset.nav);return}
  const t=e.target.closest('[data-a]');if(!t)return;
  if(t.dataset.a==='mic'){const a=window.Android;if(a&&typeof a.onMic==='function')a.onMic();else setState(document.body.dataset.state==='listening'?'idle':'listening');return}
  act(t.dataset.a)});
function tick(){const d=new Date();$('#time').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');$('#date').textContent=d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}
tick();setInterval(tick,1000);
</script>
</body>
</html>
